name: CI

on:
  push:
    branches-ignore:
      - badges
  pull_request:
    branches:
      - "**" # All branches

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Lint code (ESLint)
        run: npm run lint

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Verify committed OAuth client IDs
        run: npm run check:oauth-clients

      - name: Run unit tests (Vitest)
        run: npm run test:unit

      - name: Run integration tests (Vitest)
        run: npm run test:integration

      - name: Run tests with coverage (Vitest)
        run: npm run test:coverage

      - name: Check coverage vs main baseline
        run: node scripts/check-coverage-vs-base.mjs

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
          if-no-files-found: error

  publish-badges:
    name: Publish coverage badges
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage

      - name: Generate coverage badges
        run: node scripts/coverage-badges.mjs

      - name: Publish badges branch
        run: |
          mkdir -p /tmp/badges-publish
          cp coverage/coverage-summary.json coverage/coverage-lines.svg coverage/coverage-branches.svg /tmp/badges-publish/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin badges && git checkout -B badges origin/badges; then
            cp /tmp/badges-publish/* .
            git add coverage-summary.json coverage-lines.svg coverage-branches.svg
            git diff --cached --quiet || git commit -m "Update coverage badges"
            git push origin badges
          else
            git checkout --orphan badges
            git rm -rf --quiet . || true
            cp /tmp/badges-publish/* .
            git add coverage-summary.json coverage-lines.svg coverage-branches.svg
            git commit -m "Update coverage badges"
            git push origin HEAD:badges
          fi

  build-dev:
    name: Build (Dev)
    runs-on: ubuntu-latest
    needs: [test]
    # Only build dev artifacts for non-main branches
    if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
    environment:
      name: dev
    env:
      GOOGLE_CLIENT_ID_DEV: ${{ secrets.GOOGLE_CLIENT_ID_DEV }}
      MICROSOFT_CLIENT_ID_DEV: ${{ secrets.MICROSOFT_CLIENT_ID_DEV }}
      TODOIST_CLIENT_ID_DEV: ${{ secrets.TODOIST_CLIENT_ID_DEV }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build plugin (dev)
        run: npm run build:dev

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-syncer-dev
          path: |
            main.js
            manifest.json
            styles.css

  build-prod:
    name: Build (Prod)
    runs-on: ubuntu-latest
    needs: [test]
    # Only build production artifacts on main branch
    if: github.ref == 'refs/heads/main'
    environment:
      name: prod
    # Prod client IDs come from committed oauth-clients.prod.json (same as release.yml).
    # Do not inject *_PROD secrets — Observer rebuilds must match a clean checkout.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build plugin (prod)
        run: npm run build:prod

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-syncer-prod
          path: |
            main.js
            manifest.json
            styles.css
