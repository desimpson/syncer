name: CI

on:
  push:
    branches:
      - "**" # All branches
  pull_request:
    branches:
      - "**" # All branches

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Lint code (ESLint)
        run: npm run lint

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Verify committed OAuth client IDs
        run: npm run check:oauth-clients

      - name: Run unit tests (Vitest)
        run: npm run test:unit

      - name: Run integration tests (Vitest)
        run: npm run test:integration

  build-dev:
    name: Build (Dev)
    runs-on: ubuntu-latest
    needs: [test]
    # Only build dev artifacts for non-main branches
    if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
    environment:
      name: dev
    env:
      GOOGLE_CLIENT_ID_DEV: ${{ secrets.GOOGLE_CLIENT_ID_DEV }}
      MICROSOFT_CLIENT_ID_DEV: ${{ secrets.MICROSOFT_CLIENT_ID_DEV }}
      TODOIST_CLIENT_ID_DEV: ${{ secrets.TODOIST_CLIENT_ID_DEV }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build plugin (dev)
        run: npm run build:dev

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-syncer-dev
          path: |
            main.js
            manifest.json
            styles.css

  build-prod:
    name: Build (Prod)
    runs-on: ubuntu-latest
    needs: [test]
    # Only build production artifacts on main branch
    if: github.ref == 'refs/heads/main'
    # Prod client IDs come from committed oauth-clients.prod.json (same as release.yml).
    # Do not set environment: prod — that recreates an unused GitHub Environment.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build plugin (prod)
        run: npm run build:prod

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-syncer-prod
          path: |
            main.js
            manifest.json
            styles.css
