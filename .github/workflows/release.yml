name: Release

on:
  push:
    tags:
      - "[0-9]*" # Triggers on version tags like 0.1.0

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    environment:
      name: prod
    env:
      GOOGLE_CLIENT_ID_PROD: ${{ secrets.GOOGLE_CLIENT_ID_PROD }}
      MICROSOFT_CLIENT_ID_PROD: ${{ secrets.MICROSOFT_CLIENT_ID_PROD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for tags

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Lint code (ESLint)
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build plugin (prod)
        run: npm run build:prod

      - name: Verify release readiness
        run: npm run release:check

      - name: Extract version from tag
        id: get_version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=$TAG_NAME
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building release for version: $VERSION (tag: $TAG_NAME)"

      - name: Verify tag matches manifest version
        run: |
          TAG_NAME=${{ steps.get_version.outputs.tag }}
          MANIFEST_VERSION=$(node -p "JSON.parse(require('node:fs').readFileSync('manifest.json', 'utf8')).version")
          if [ "$TAG_NAME" != "$MANIFEST_VERSION" ]; then
            echo "Tag ($TAG_NAME) does not match manifest version ($MANIFEST_VERSION)."
            exit 1
          fi

      - name: Generate release asset attestations
        id: attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            main.js
            manifest.json
            styles.css
            ${{ steps.attest.outputs.bundle-path }}
          name: ${{ steps.get_version.outputs.version }}
          tag_name: ${{ steps.get_version.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
